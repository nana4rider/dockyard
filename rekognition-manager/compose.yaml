services:
  bff:
    image: ghcr.io/nana4rider/rekognition-manager/bff:latest
    container_name: rekognition-manager-bff
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - ~/config/common/base.env
      - ~/config/rekognition-manager/app.env
    restart: always
    healthcheck:
      test: [ 'CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3001/health' ]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    image: ghcr.io/nana4rider/rekognition-manager/web:latest
    container_name: rekognition-manager
    depends_on:
      bff:
        condition: service_healthy
    environment:
      BFF_ORIGIN: http://bff:3001
    ports:
      - '3200:3000'
    restart: always

networks:
  common_network:
    external: true
