name: Lint

on:
  workflow_call:
  pull_request:
    branches:
      - main

jobs:
  dclint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7

      - name: Run dclint
        run: npx dclint **/compose.yaml

      - uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
