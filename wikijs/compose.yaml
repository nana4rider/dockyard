services:
  app:
    image: ghcr.io/requarks/wiki:3.6.1
    container_name: wikijs
    depends_on:
      - db
    env_file:
      - ~/config/common/base.env
      - ~/config/wikijs/app.env
    ports:
      - '7777:3000'
    networks:
      - default
      - common_network
    restart: always

  db:
    image: postgres:18.7
    container_name: wikijs-db
    volumes:
      - ~/data/wikijs/postgresql:/var/lib/postgresql
    env_file:
      - ~/config/common/base.env
      - ~/config/wikijs/db.env
    restart: always
    user: "1000:1000"

networks:
  common_network:
    external: true
