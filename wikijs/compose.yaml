services:
  app:
    image: ghcr.io/requarks/wiki:3.6.1
    container_name: wikijs
    depends_on:
      - db
    volumes:
      - ~/config/wikijs/.ssh/id_ed25519:/wiki/private.key:ro
    env_file:
      - ~/config/common/base.env
      - ~/config/wikijs/app.env
    networks:
      - default
      - common_network
    restart: always

  db:
    image: postgres:19.0
    container_name: wikijs-db
    volumes:
      - ~/data/wikijs/postgresql:/var/lib/postgresql
    env_file:
      - ~/config/common/base.env
      - ~/config/wikijs/db.env
    restart: always
    user: "1000:1000"

networks:
  common_network:
    external: true
