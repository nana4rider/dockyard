services:
  mjpeg-face-recognition:
    image: ghcr.io/nana4rider/mjpeg-face-recognition:latest
    container_name: mjpeg-face-recognition
    volumes:
      - ~/data/mjpeg-face-recognition/snapshot:/app/snapshot
    env_file:
      - ~/config/common/base.env
      - ~/config/mjpeg-face-recognition/app.env
    network_mode: host
    restart: always
